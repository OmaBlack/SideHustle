# Ticket 0.3: lint, typecheck, unit, integration, build, OpenAPI diff on every PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests (90% coverage gate on pricing)
        run: pnpm turbo run test:coverage --filter=@sidehustle/pricing && pnpm turbo run test --filter=!@sidehustle/pricing
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  integration:
    name: Integration tests (Postgres 16, Redis 7)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sidehustle
          POSTGRES_PASSWORD: sidehustle
          POSTGRES_DB: sidehustle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sidehustle" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sidehustle:sidehustle@localhost:5432/sidehustle_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations match the schema
        run: |
          pnpm --filter @sidehustle/db exec drizzle-kit generate --name ci_check
          if [ -n "$(git status --porcelain -- packages/db/drizzle)" ]; then
            echo "::error::Schema changed without a migration. Run pnpm --filter @sidehustle/db db:generate and commit it."
            git status --porcelain -- packages/db/drizzle
            exit 1
          fi
      - name: Migrations up, down (reset) and up; seed reproduces the golden table
        run: pnpm turbo run test --filter=@sidehustle/db --filter=@sidehustle/api

  openapi:
    name: OpenAPI diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm openapi
      - name: Committed openapi.json is current
        run: git diff --exit-code -- apps/api/openapi.json || (echo "::error::API changed. Run pnpm openapi and commit apps/api/openapi.json so the change is reviewed." && exit 1)

  ui:
    name: UI accessibility (axe, light and dark, 320px and desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sidehustle/web exec playwright install --with-deps chromium
      - run: pnpm turbo run build --filter=@sidehustle/web
      - run: pnpm test:e2e
