# Local development services (ticket 0.2). `docker compose up -d`, then `pnpm db:migrate && pnpm db:seed && pnpm dev`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sidehustle
      POSTGRES_PASSWORD: sidehustle
      POSTGRES_DB: sidehustle
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sidehustle']
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # S3-compatible stand-in for Cloudflare R2 (product images, private KYC bucket).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: sidehustle
      MINIO_ROOT_PASSWORD: sidehustle-secret
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]

  # Catches outgoing email locally; UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  miniodata:
